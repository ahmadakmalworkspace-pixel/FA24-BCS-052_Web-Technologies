<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 - Responsive Navbar and Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">MyLogo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        </ul>
        <a class="btn btn-outline-light" href="#">Cart 🛒</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

      <div class="col"><div class="card text-center"><div class="bg-secondary text-white p-5">Image</div><div class="card-body"><h5>Product 1</h5><p>$30</p></div></div></div>
      <div class="col"><div class="card text-center"><div class="bg-secondary text-white p-5">Image</div><div class="card-body"><h5>Product 2</h5><p>$25</p></div></div></div>
      <div class="col"><div class="card text-center"><div class="bg-secondary text-white p-5">Image</div><div class="card-body"><h5>Product 3</h5><p>$99</p></div></div></div>
      <div class="col"><div class="card text-center"><div class="bg-secondary text-white p-5">Image</div><div class="card-body"><h5>Product 4</h5><p>$60</p></div></div></div>
      <div class="col"><div class="card text-center"><div class="bg-secondary text-white p-5">Image</div><div class="card-body"><h5>Product 5</h5><p>$80</p></div></div></div>
      <div class="col"><div class="card text-center"><div class="bg-secondary text-white p-5">Image</div><div class="card-body"><h5>Product 6</h5><p>$45</p></div></div></div>
      <div class="col"><div class="card text-center"><div class="bg-secondary text-white p-5">Image</div><div class="card-body"><h5>Product 7</h5><p>$50</p></div></div></div>
      <div class="col"><div class="card text-center"><div class="bg-secondary text-white p-5">Image</div><div class="card-body"><h5>Product 8</h5><p>$35</p></div></div></div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
